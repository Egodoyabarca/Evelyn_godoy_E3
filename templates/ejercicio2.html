<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
    <title>Formulario de Nombres</title>
</head>
<body>
<div class="form-card">
    <h2>Formulario de Nombres</h2>
    <form method="POST">
        <label>Nombre 1:</label><input type="text" name="nombre1" required>
        <label>Nombre 2:</label><input type="text" name="nombre2" required>
        <label>Nombre 3:</label><input type="text" name="nombre3" required>
        <button type="submit" class="btn-small">Enviar</button>
    </form>
    {% if nombre_largo %}
        <p>El nombre con mayor caracteres es: {{ nombre_largo }}</p>
        <p>El nombre tiene: {{ largo }} caracteres</p>
    {% endif %}
</div>
</body>
</html>
